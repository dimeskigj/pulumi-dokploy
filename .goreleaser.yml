version: 2
project_name: pulumi-dokploy
builds:
- id: build-provider
  dir: provider
  env:
  - CGO_ENABLED=0
  - GO111MODULE=on
  goos:
  - darwin
  - linux
  goarch:
  - amd64
  - arm64
  ignore: &a1 []
  main: ./cmd/pulumi-resource-dokploy/
  ldflags: &a2
    - -s
    - -w
    - -X
      github.com/dimeskigj/pulumi-dokploy/provider.Version={{.Tag}}
  binary: pulumi-resource-dokploy
- id: build-provider-windows
  dir: provider
  env:
  - CGO_ENABLED=0
  - GO111MODULE=on
  goos:
  - windows
  goarch:
  - amd64
  - arm64
  ignore: *a1
  main: ./cmd/pulumi-resource-dokploy/
  ldflags: *a2
  binary: pulumi-resource-dokploy
archives:
- name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
  id: archive
checksum:
  name_template: checksums.txt
  algorithm: sha256
sboms:
- artifacts: archive
snapshot:
  version_template: "{{ .Version }}-SNAPSHOT"
changelog:
  disable: true
release:
  prerelease: auto
  disable: false
