name: release-smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable or prerelease SemVer without the leading v
        required: true
        type: string

jobs:
  provider:
    name: provider artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GOVERSION: "1.26.6"
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      PROVIDER_CACHE: ${{ runner.temp }}/provider-cache-${{ github.job }}
    steps:
      - name: Validate exact SemVer
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$VERSION" != v* ]]
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Download and verify provider archive
        run: |
          set -euo pipefail
          mkdir -p "$PROVIDER_CACHE" "$PULUMI_HOME"
          os=linux
          arch=amd64
          archive="pulumi-resource-dokploy-v${VERSION}-${os}-${arch}.tar.gz"
          base="https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error "$base/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          grep -F "  $archive" "$RUNNER_TEMP/checksums.txt" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$PROVIDER_CACHE"
          provider="$PROVIDER_CACHE/pulumi-resource-dokploy"
          test -x "$provider"
          "$provider" --version
          pulumi plugin install resource dokploy "$VERSION" --file "$provider" --reinstall
      - name: Load released provider schema
        run: |
          set -euo pipefail
          pulumi package get-schema dokploy > "$RUNNER_TEMP/dokploy-schema.json"
          test -s "$RUNNER_TEMP/dokploy-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"

  node:
    name: Node.js consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      npm_config_cache: ${{ runner.temp }}/npm-cache-${{ github.job }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Install exact Node package and compile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/node-consumer"
          cd "$RUNNER_TEMP/node-consumer"
          npm init --yes
          npm install --save "@dimeskigj/pulumi-dokploy@${{ inputs.version }}" --save-dev typescript@5.9.2
          printf 'import * as dokploy from "@dimeskigj/pulumi-dokploy";\nvoid dokploy;\n' > index.ts
          npx tsc --noEmit --target es2020 --module commonjs index.ts
      - name: Preview with fresh provider cache
        run: |
          set -euo pipefail
          mkdir -p "$PULUMI_HOME" "$RUNNER_TEMP/node-program"
          printf 'name: release-smoke\nruntime: yaml\nresources:\n  provider:\n    type: pulumi:providers:dokploy\n    properties:\n      endpoint: https://example.invalid\n      apiKey: smoke\n' > "$RUNNER_TEMP/node-program/Pulumi.yaml"
          pulumi plugin install resource dokploy "$VERSION" --server "https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          pulumi stack init smoke --non-interactive --cwd "$RUNNER_TEMP/node-program"
          pulumi preview --non-interactive --stack smoke --cwd "$RUNNER_TEMP/node-program"
          pulumi package get-schema dokploy > "$RUNNER_TEMP/node-schema.json"
          test -s "$RUNNER_TEMP/node-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"

  python:
    name: Python consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache-${{ github.job }}
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: 3.11.15
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Install exact Python package and compile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-consumer"
          python -m venv "$RUNNER_TEMP/python-consumer/venv"
          source "$RUNNER_TEMP/python-consumer/venv/bin/activate"
          # Public distribution name is pulumi-dokploy; import coordinate is pulumi_dokploy==${{ inputs.version }}.
          python -m pip install "pulumi-dokploy==${{ inputs.version }}"
          printf 'import pulumi_dokploy\n' > "$RUNNER_TEMP/python-consumer/main.py"
          python -m py_compile "$RUNNER_TEMP/python-consumer/main.py"
      - name: Preview with fresh provider cache
        run: |
          set -euo pipefail
          mkdir -p "$PULUMI_HOME" "$RUNNER_TEMP/python-program"
          printf 'name: release-smoke\nruntime: yaml\nresources:\n  provider:\n    type: pulumi:providers:dokploy\n    properties:\n      endpoint: https://example.invalid\n      apiKey: smoke\n' > "$RUNNER_TEMP/python-program/Pulumi.yaml"
          pulumi plugin install resource dokploy "$VERSION" --server "https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          pulumi stack init smoke --non-interactive --cwd "$RUNNER_TEMP/python-program"
          pulumi preview --non-interactive --stack smoke --cwd "$RUNNER_TEMP/python-program"
          pulumi package get-schema dokploy > "$RUNNER_TEMP/python-schema.json"
          test -s "$RUNNER_TEMP/python-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"

  dotnet:
    name: .NET consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      NUGET_PACKAGES: ${{ runner.temp }}/nuget-cache-${{ github.job }}
    steps:
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Install exact .NET package and compile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet-consumer"
          cd "$RUNNER_TEMP/dotnet-consumer"
          dotnet new console --framework net8.0 --no-restore
          dotnet add package Dimeskigj.Pulumi.Dokploy --version "${{ inputs.version }}"
          dotnet build --no-restore
      - name: Preview with fresh provider cache
        run: |
          set -euo pipefail
          mkdir -p "$PULUMI_HOME" "$RUNNER_TEMP/dotnet-program"
          printf 'name: release-smoke\nruntime: yaml\nresources:\n  provider:\n    type: pulumi:providers:dokploy\n    properties:\n      endpoint: https://example.invalid\n      apiKey: smoke\n' > "$RUNNER_TEMP/dotnet-program/Pulumi.yaml"
          pulumi plugin install resource dokploy "$VERSION" --server "https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          pulumi stack init smoke --non-interactive --cwd "$RUNNER_TEMP/dotnet-program"
          pulumi preview --non-interactive --stack smoke --cwd "$RUNNER_TEMP/dotnet-program"
          pulumi package get-schema dokploy > "$RUNNER_TEMP/dotnet-schema.json"
          test -s "$RUNNER_TEMP/dotnet-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"

  java:
    name: Java consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-cache-${{ github.job }}
    steps:
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5
        with:
          distribution: temurin
          java-version: 11
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Install exact Java package and compile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-consumer/src/main/java/smoke"
          cd "$RUNNER_TEMP/java-consumer"
          printf 'rootProject.name = "release-smoke"\n' > settings.gradle
          printf 'plugins { id "java" }\nrepositories { mavenCentral() }\ndependencies { implementation "net.dimeski.pulumi:dokploy:${{ inputs.version }}" }\n' > build.gradle
          printf 'package smoke;\nimport net.dimeski.pulumi.dokploy.*;\npublic class Main { public static void main(String[] args) {} }\n' > src/main/java/smoke/Main.java
          gradle compileJava --no-daemon
      - name: Preview with fresh provider cache
        run: |
          set -euo pipefail
          mkdir -p "$PULUMI_HOME" "$RUNNER_TEMP/java-program"
          printf 'name: release-smoke\nruntime: yaml\nresources:\n  provider:\n    type: pulumi:providers:dokploy\n    properties:\n      endpoint: https://example.invalid\n      apiKey: smoke\n' > "$RUNNER_TEMP/java-program/Pulumi.yaml"
          pulumi plugin install resource dokploy "$VERSION" --server "https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          pulumi stack init smoke --non-interactive --cwd "$RUNNER_TEMP/java-program"
          pulumi preview --non-interactive --stack smoke --cwd "$RUNNER_TEMP/java-program"
          pulumi package get-schema dokploy > "$RUNNER_TEMP/java-schema.json"
          test -s "$RUNNER_TEMP/java-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"

  go:
    name: Go consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      GOVERSION: "1.26.6"
      PULUMI_HOME: ${{ runner.temp }}/pulumi-home-${{ github.job }}
      PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend-${{ github.job }}
      GOPATH: ${{ runner.temp }}/go-cache-${{ github.job }}
      GOMODCACHE: ${{ runner.temp }}/gomod-cache-${{ github.job }}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
      - name: Install pinned Pulumi CLI
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://get.pulumi.com/releases/sdk/pulumi-v3.159.0-linux-x64.tar.gz -o "$RUNNER_TEMP/pulumi.tgz"
          tar -xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      - name: Install exact Go module and compile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-consumer"
          cd "$RUNNER_TEMP/go-consumer"
          go mod init smoke.example/release
          go get "github.com/dimeskigj/pulumi-dokploy/sdk/go/dokploy@v${{ inputs.version }}"
          printf 'package main\nimport _ "github.com/dimeskigj/pulumi-dokploy/sdk/go/dokploy"\nfunc main() {}\n' > main.go
          go build ./...
      - name: Preview with fresh provider cache
        run: |
          set -euo pipefail
          mkdir -p "$PULUMI_HOME" "$RUNNER_TEMP/go-program"
          printf 'name: release-smoke\nruntime: yaml\nresources:\n  provider:\n    type: pulumi:providers:dokploy\n    properties:\n      endpoint: https://example.invalid\n      apiKey: smoke\n' > "$RUNNER_TEMP/go-program/Pulumi.yaml"
          pulumi plugin install resource dokploy "$VERSION" --server "https://github.com/dimeskigj/pulumi-dokploy/releases/download/v${VERSION}"
          pulumi stack init smoke --non-interactive --cwd "$RUNNER_TEMP/go-program"
          pulumi preview --non-interactive --stack smoke --cwd "$RUNNER_TEMP/go-program"
          pulumi package get-schema dokploy > "$RUNNER_TEMP/go-schema.json"
          test -s "$RUNNER_TEMP/go-schema.json"
          test -n "$(find "$PULUMI_HOME/plugins" -maxdepth 1 -type d -name "resource-dokploy-v${VERSION}-*" -print -quit)"
