version: "2"
linters:
  enable: [goconst, gosec, misspell, nakedret, unconvert]
  disable:
    # lll and revive are style/documentation policy, not correctness gates.
    - lll
    - revive
  exclusions:
    generated: lax
    rules:
      - linters: [goconst]
        path: '.*_test\.go'
formatters:
  enable: [gofmt]
