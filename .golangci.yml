version: "2"
linters:
  enable: [goconst, gosec, misspell, nakedret, unconvert]
  disable: [lll, revive]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - schema.go
      - pulumiManifest.go
      - pkg/vendored
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - revive
        path: pkg/
        text: "var-naming"
      - linters:
          - goconst
        path: '.*_test\.go'
formatters:
  enable:
    - gofmt
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard library packages.
        - blank # Blank section: contains all blank imports.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/pulumi/) # Custom section: groups all imports with the github.com/pulumi/ prefix.
        - prefix(github.com/pulumi/pulumi-dokploy) # Custom section: local imports
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - schema.go
      - pulumiManifest.go
      - pkg/vendored
      - third_party$
      - builtin$
      - examples$
