name: dokploy-mvp
runtime: python
description: A complete Dokploy MVP deployment.
config:
  appHost:
    type: string
    default: app.example.invalid
  bitbucketApiToken:
    type: string
    default: replace-with-bitbucket-api-token
    secret: true
  bitbucketEmail:
    type: string
    default: example@example.invalid
  bitbucketWorkspaceName:
    type: string
    default: example-workspace
  composeHost:
    type: string
    default: compose.example.invalid
  databasePassword:
    type: string
    default: replace-with-a-database-password
    secret: true
  destinationAccessKey:
    type: string
    default: replace-with-a-destination-access-key
  destinationSecretAccessKey:
    type: string
    default: replace-with-a-destination-secret-access-key
    secret: true
  dokploy:apiKey:
    value: replace-with-a-dokploy-api-key
    secret: true
  dokploy:endpoint:
    value: https://dokploy.example.invalid
  fileMountContent:
    type: string
    default: ""
    secret: true
  gitBranch:
    type: string
    default: main
  giteaClientId:
    type: string
    default: replace-with-gitea-oauth-client-id
  giteaClientSecret:
    type: string
    default: replace-with-gitea-oauth-client-secret
    secret: true
  giteaInternalUrl:
    type: string
    default: https://gitea.internal.example.invalid
    secret: true
  giteaRedirectUri:
    type: string
    default: https://dokploy.example.invalid/api/auth/gitea/callback
  gitlabApplicationId:
    type: string
    default: replace-with-gitlab-oauth-application-id
  gitlabApplicationSecret:
    type: string
    default: ""
    secret: true
  gitlabIntegration:
    type: string
    default: gitlab-integration-id
  gitlabNamespace:
    type: string
    default: platform
  gitlabOwner:
    type: string
    default: example
  gitlabProject:
    type: integer
    default: 42
  gitlabRedirectUri:
    type: string
    default: https://dokploy.example.invalid/api/providers/gitlab/callback
  gitlabRepository:
    type: string
    default: application
  mariadbPassword:
    type: string
    default: replace-with-a-mariadb-password
    secret: true
  mongodbPassword:
    type: string
    default: replace-with-a-mongodb-password
    secret: true
  mysqlPassword:
    type: string
    default: replace-with-a-mysql-password
    secret: true
  redisPassword:
    type: string
    default: replace-with-a-redis-password
    secret: true
  registryPassword:
    type: string
    default: ""
    secret: true
  sshPrivateKey:
    type: string
    default: ""
    secret: true
