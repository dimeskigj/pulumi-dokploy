name: dokploy-mvp
runtime: go
description: A complete Dokploy MVP deployment.
config:
  appHost:
    type: string
    default: app.example.invalid
  composeHost:
    type: string
    default: compose.example.invalid
  databasePassword:
    type: string
    default: replace-with-a-database-password
    secret: true
  destinationAccessKey:
    type: string
    default: replace-with-a-destination-access-key
  destinationSecretAccessKey:
    type: string
    default: replace-with-a-destination-secret-access-key
    secret: true
  dokploy:apiKey:
    value: replace-with-a-dokploy-api-key
    secret: true
  dokploy:endpoint:
    value: https://dokploy.example.invalid
  gitBranch:
    type: string
    default: main
  gitlabIntegration:
    type: string
    default: gitlab-integration-id
  gitlabNamespace:
    type: string
    default: platform
  gitlabOwner:
    type: string
    default: example
  gitlabProject:
    type: integer
    default: 42
  gitlabRepository:
    type: string
    default: application
  mariadbPassword:
    type: string
    default: replace-with-a-mariadb-password
    secret: true
  mongodbPassword:
    type: string
    default: replace-with-a-mongodb-password
    secret: true
  mysqlPassword:
    type: string
    default: replace-with-a-mysql-password
    secret: true
  redisPassword:
    type: string
    default: replace-with-a-redis-password
    secret: true
  registryPassword:
    type: string
    default: replace-with-a-registry-password
    secret: true
