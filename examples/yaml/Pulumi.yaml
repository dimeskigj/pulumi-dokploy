name: dokploy-mvp
runtime: yaml

description: A complete Dokploy MVP deployment.

outputs:
  gitlabIntegration: ${gitlabIntegration}
  gitlabProject: ${gitlabProject}
  gitlabOwner: ${gitlabOwner}
  gitlabNamespace: ${gitlabNamespace}
  gitlabRepository: ${gitlabRepository}
  gitBranch: ${gitBranch}

config:
  dokploy:endpoint: https://dokploy.example.invalid
  dokploy:apiKey:
    secret: true
    value: replace-with-a-dokploy-api-key
  appHost:
    type: string
    default: app.example.invalid
  composeHost:
    type: string
    default: compose.example.invalid
  gitlabIntegration:
    type: string
    default: gitlab-integration-id
  gitlabProject:
    type: integer
    default: 42
  gitlabOwner:
    type: string
    default: example
  gitlabNamespace:
    type: string
    default: platform
  gitlabRepository:
    type: string
    default: application
  gitBranch:
    type: string
    default: main
  sshPrivateKey:
    type: string
    secret: true
    default: replace-with-an-ssh-private-key
  registryPassword:
    type: string
    secret: true
    default: replace-with-a-registry-password
  databasePassword:
    type: string
    secret: true
    default: replace-with-a-database-password
  mysqlPassword:
    type: string
    secret: true
    default: replace-with-a-mysql-password
  mariadbPassword:
    type: string
    secret: true
    default: replace-with-a-mariadb-password
  mongodbPassword:
    type: string
    secret: true
    default: replace-with-a-mongodb-password
  redisPassword:
    type: string
    secret: true
    default: replace-with-a-redis-password
  destinationAccessKey:
    type: string
    default: replace-with-a-destination-access-key
  destinationSecretAccessKey:
    type: string
    secret: true
    default: replace-with-a-destination-secret-access-key

resources:
  project:
    type: dokploy:index:Project
    properties:
      name: dokploy-mvp
      description: Canonical Dokploy provider example

  environment:
    type: dokploy:index:Environment
    properties:
      projectId: ${project.projectId}
      name: staging
      description: Additional non-production environment

  application:
    type: dokploy:index:Application
    properties:
      name: mvp-application
      environmentId: ${project.defaultEnvironmentId}
      source:
        type: docker
        docker:
          image: nginx:1.27
          username: example
          password:
            fn::secret: ${registryPassword}
      environment:
        fn::secret: APP_HOST=${appHost}
      createEnvFile: true
      registryId: ${registry.registryId}
      buildRegistryId: ${registry.registryId}

      # Alternative source (documentation only; do not enable alongside docker):
      # source:
      #   type: git
      #   git:
      #     url: https://github.com/example/application.git
      #     branch: main
      #     sshKeyId: ${sshKey.sshKeyId}
      #     build:
      #       type: nixpacks
      # Alternative GitLab source (documentation only; do not enable alongside docker):
      # source:
      #   type: gitlab
      #   gitlab:
      #     integrationId: ${config.gitlabIntegration}
      #     projectId: ${config.gitlabProject}
      #     owner: ${config.gitlabOwner}
      #     namespace: ${config.gitlabNamespace}
      #     repository: ${config.gitlabRepository}
      #     branch: ${config.gitBranch}
      #     build:
      #       type: nixpacks

  compose:
    type: dokploy:index:Compose
    properties:
      name: mvp-compose
      environmentId: ${project.defaultEnvironmentId}
      source:
        type: raw
        raw:
          composeFile: |
            services:
              web:
                image: nginx:1.27
                ports:
                  - "8080:80"
      environment:
        fn::secret: COMPOSE_HOST=${composeHost}
      createEnvFile: true

  sshKey:
    type: dokploy:index:SSHKey
    properties:
      name: mvp-git-ssh
      privateKey:
        fn::secret: ${sshPrivateKey}
      publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample dokploy-mvp

  registry:
    type: dokploy:index:Registry
    properties:
      name: mvp-registry
      username: example
      password:
        fn::secret: ${registryPassword}
      url: registry.example.invalid
      imagePrefix: dokploy/

  tag:
    type: dokploy:index:Tag
    properties:
      name: mvp
      color: "#2dd4bf"

  projectTag:
    type: dokploy:index:ProjectTag
    properties:
      projectId: ${project.projectId}
      tagId: ${tag.tagId}

  applicationBindMount:
    type: dokploy:index:Mount
    properties:
      type: bind
      mountPath: /var/lib/dokploy
      hostPath: /srv/dokploy
      applicationId: ${application.applicationId}

  composeVolumeMount:
    type: dokploy:index:Mount
    properties:
      type: volume
      mountPath: /var/lib/postgresql/data
      volumeName: mvp-postgres-data
      composeId: ${compose.composeId}

  postgresFileMount:
    type: dokploy:index:Mount
    properties:
      type: file
      mountPath: /etc/app/config.toml
      filePath: /tmp/dokploy-config.toml
      content:
        fn::secret: APP_ENV=staging

  postgres:
    type: dokploy:index:Postgres
    properties:
      name: mvp-postgres
      environmentId: ${environment.environmentId}
      databaseName: app
      databaseUser: app
      databasePassword:
        fn::secret: ${databasePassword}
      environment:
        fn::secret: POSTGRES_HOST=postgres

  mysql:
    type: dokploy:index:MySQL
    properties:
      name: mvp-mysql
      environmentId: ${environment.environmentId}
      databaseName: app
      databaseUser: app
      databasePassword:
        fn::secret: ${mysqlPassword}
      environment:
        fn::secret: MYSQL_HOST=mysql

  mariadb:
    type: dokploy:index:MariaDB
    properties:
      name: mvp-mariadb
      environmentId: ${environment.environmentId}
      databaseName: app
      databaseUser: app
      databasePassword:
        fn::secret: ${mariadbPassword}
      environment:
        fn::secret: MARIADB_HOST=mariadb

  mongodb:
    type: dokploy:index:MongoDB
    properties:
      name: mvp-mongodb
      environmentId: ${environment.environmentId}
      databaseUser: app
      databasePassword:
        fn::secret: ${mongodbPassword}
      environment:
        fn::secret: MONGODB_HOST=mongodb

  redis:
    type: dokploy:index:Redis
    properties:
      name: mvp-redis
      environmentId: ${environment.environmentId}
      databasePassword:
        fn::secret: ${redisPassword}
      environment:
        fn::secret: REDIS_HOST=redis

  destination:
    type: dokploy:index:Destination
    properties:
      name: mvp-destination
      provider: s3
      accessKey: ${destinationAccessKey}
      secretAccessKey:
        fn::secret: ${destinationSecretAccessKey}
      bucket: dokploy-mvp-backups
      region: us-east-1
      endpoint: https://s3.us-east-1.amazonaws.com

  postgresBackup:
    type: dokploy:index:Backup
    properties:
      schedule: "0 0 * * *"
      prefix: postgres-
      destinationId: ${destination.destinationId}
      database: app
      postgresId: ${postgres.postgresId}

  applicationVolumeBackup:
    type: dokploy:index:VolumeBackup
    properties:
      name: mvp-application-volume-backup
      volumeName: mvp-application-data
      prefix: application-
      destinationId: ${destination.destinationId}
      cronExpression: "0 0 * * *"
      applicationId: ${application.applicationId}

  composeVolumeBackup:
    type: dokploy:index:VolumeBackup
    properties:
      name: mvp-compose-volume-backup
      volumeName: mvp-compose-data
      prefix: compose-
      destinationId: ${destination.destinationId}
      cronExpression: "0 0 * * *"
      composeId: ${compose.composeId}
      serviceName: web

  applicationDomain:
    type: dokploy:index:Domain
    properties:
      applicationId: ${application.applicationId}
      host: ${appHost}
      port: 80
      https: true
      certificateType: none
      enabled: true

  composeDomain:
    type: dokploy:index:Domain
    properties:
      composeId: ${compose.composeId}
      serviceName: web
      host: ${composeHost}
      port: 80
      https: true
      certificateType: none
      enabled: true
